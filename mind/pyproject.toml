[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kilo-mind"
version = "0.0.1"
description = "Kilo mind: Python control software for the Kilo Nybble body firmware"
requires-python = ">=3.11"
# noiseprotocol: the host channel's Noise handshake and records (kilo.hostsecure, kilo --host);
# it brings cryptography, which kilo.hostkey uses for the X25519 key pair.
dependencies = ["noiseprotocol>=0.3.1"]

[project.optional-dependencies]
test = ["pytest"]  # optional: pytest-xdist for `pytest -n 4`
# PyYAML for personality.yaml (apt python3-yaml on Raspbian); without it a
# built-in parser reads the subset the file uses.
behaviour = ["PyYAML>=5"]

[project.scripts]
kilo = "kilo.cli:main"

[tool.setuptools.packages.find]
include = ["kilo*"]

[tool.setuptools.package-data]
"kilo.tricks" = ["library/*.json"]
"kilo.intent" = ["moves/*.json"]
"kilo.behaviour" = ["personality.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes seconds of wall time (subprocesses, real-time waits); in the default run, `-m 'not slow'` skips them",
]
