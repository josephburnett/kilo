# Kilo body <-> mind protocol: the single source of truth.
#
# docs/architecture.md §4 and Appendix E describe this file in prose; where
# they disagree with it, fix the document. After editing, run
#     python3 protocol/gen.py
# to regenerate protocol/gen/ and protocol/vectors/, then protocol/test.sh.
#
# Conventions
#   * All multi-byte fields are little-endian. Payload structs are packed.
#   * Field types: u8 i8 u16 i16 u32, or the name of a [structs.*] entry, or
#     "bytes" (a raw tail whose length is implied by the payload length).
#   * `count = N` makes a fixed array. `count_field = "x"` makes a variable
#     array whose element count is stored in the earlier u8 field x;
#     `min`/`max` bound the count (or, for "bytes", the tail length).
#   * `unit` names the physical unit of the raw integer; `scale` converts raw
#     to `unit` (physical = raw * scale). `range` is the accepted raw range;
#     out-of-range values are BAD_ARG (they never change the frame length).
#   * `enum` / `flags` name entries of [enums.*] / [flags.*].
#   * kind: goal    = Pi->body, never acked, idempotent, refreshed at 5 Hz;
#                     rejections are EVENT GOAL_REFUSED(type << 8 | reason),
#                     reason = an ack_status code, rate-limited per type;
#           command = Pi->body. Two classes:
#             query = true: answered by its data reply only (the message whose
#                     reply_to names it); an ACK only on failure (status != OK).
#                     Never de-duplicated: a repeated query is answered again,
#                     and the mind retries a query with a fresh seq.
#             otherwise: always exactly one ACK. The body caches the last
#                     (seq, type, status) of an executed non-query command for
#                     dedup_window_ms; a repeat with the same seq and type is
#                     re-ACKed with the cached status and not executed again.
#                     The mind retries with the same seq.
#           stream  = body->Pi periodic, droppable (drop_order: lowest first);
#           event   = body->Pi, never dropped, never acked by the Pi
#                     (`reply_to` names the command it answers, if any).
#   * epoch = true: the payload begins with the goal epoch byte.

[meta]
proto_major = 3                # 3.0 (2026-11-22): one stream of poses (POSE) replaces FEET and the five TRICK messages; the body's trick player, its built-in get-up (rc) and param FALL_RC are gone; TELEMETRY reports which legs a limit cut
proto_minor = 0

# ---------------------------------------------------------------------------
[link]
baud = 250000                  # 8N1, no flow control; exact on 328P (UBRR=3, U2X off) and PL011 (48 MHz / 12)
max_payload = 60               # bytes
header_bytes = 2               # type u8, seq u8
crc_bytes = 2                  # CRC-16/CCITT-FALSE, LE, over type..payload (type, seq, payload)
min_decoded = 4                # type + seq + crc
max_decoded = 64               # 2 + 60 + 2
max_wire = 66                  # COBS(max_decoded) = 65, plus the 0x00 delimiter
frame_overhead = 6             # wire bytes = payload + 6 (type, seq, crc x2, COBS code, delimiter)
delimiter = 0x00
crc_init = 0xFFFF
crc_poly = 0x1021
crc_check = 0x29B1             # CRC of ASCII "123456789"
tick_hz = 50
tick_ms = 20
telemetry_default_div = 2      # SET_STREAM telem_div default: 50 Hz / 2 (= param TELEM_DIV's default; gen.py checks)
telemetry_default_hz = 25      # tick_hz / telemetry_default_div
goal_refresh_hz = 5            # mind re-sends active goals at this rate (and on change)
pose_depth = 5                 # POSE keys the body queues; one already past, more than pose_max_ahead_ticks ahead, or later than every queued key with the queue full is dropped (STATS pose_dropped)
pose_lookahead_ticks = 3       # how far ahead of the body's tick the mind streams a pose it sends every tick (60 ms: the recordings never used more than 23 ms of the old 100, docs/movement-engine-results.md section 1)
pose_hold_ticks = 5            # the last key reached and none queued: hold this long before the swing feet settle (100 ms)
pose_max_ahead_ticks = 250     # a key at most this far ahead of the body's tick (5 s): a slow move may be one key
heartbeat_idle_ms = 100        # mind sends HEARTBEAT after this long with nothing sent
mind_alive_ms = 1000           # ...but only while its asyncio loop proved alive within this
cmd_retry_ms = 50              # command retry timeout
cmd_max_retries = 3
dedup_window_ms = 500          # body forgets the cached (seq, type, status) after this (a new mind session reuses seqs)
body_lost_ms = 300             # mind treats the body as lost after this long without TELEMETRY
hello_poll_hz = 2              # mind polls HELLO_REQ at this rate while the body is lost
goal_refused_min_interval_ms = 1000   # EVENT GOAL_REFUSED rate limit, per message type
head_hold_ms = 2000            # SET_HEAD hold released after this long without a refresh
tx_ring_bytes = 96
event_queue_depth = 8
eeprom_read_max = 56
reboot_magic = 0x4B49          # "KI"
reset_pulse_ms = 100           # GPIO4 low time for the flash reset (Appendix F)
param_slots = 20               # persisted param slots in the config block; param ids < this (16 until proto 1.4: the slot's reserved bytes became params 16..19)
beep_max_notes = 8
joint_count = 11               # driven joints, canonical order (JOINTS; POSE legs and head)
channel_count = 16             # PCA9685 channels / calibration slots
pca_full_off_bit = 0x1000      # PCA_COUNTS: bit 12 = channel full-off

# ---------------------------------------------------------------------------
[enums.ack_status]
OK = 0
BAD_LEN = 1
BAD_ARG = 2
BUSY = 3
UNKNOWN_TYPE = 4
REFUSED_LOW_BATT = 7
REFUSED_FALLEN = 8
EEPROM_BUSY = 9
STALE = 10              # epoch mismatch
UNCALIBRATED = 11       # STAND refused while config_state is DEFAULTED (no calibration)

# EVENT GOAL_REFUSED reason: a subset of ack_status values (same codes).
[enums.goal_refused_reason]
BAD_LEN = 1
BAD_ARG = 2
BUSY = 3                # POSE: another reflex holds the joints, or IDLE is LIMP or CALIB
UNKNOWN_TYPE = 4        # a goal this firmware does not implement
LOW_BATT = 7
FALLEN = 8
STALE = 10
UNCALIBRATED = 11

[enums.event]
BOOT = 1                # arg = reset_cause
FELL = 2                # arg = +-1 roll fall (sign = roll sign), +-2 pitch fall
LYING = 4               # after a fall he is still: the body lays him down (REST) and goes limp 2 s later; arg = the FELL arg
LOW_BATTERY = 5         # arg = level: 1 WARN, 2 LOW, 3 CRITICAL
BATTERY_OK = 6
WATCHDOG = 7
LINK_RESTORED = 8
IMU_FAULT = 9
IMU_OK = 10
STREAM_STOPPED = 12     # the POSE stream ended: arg 0 a posture, an epoch bump or a reflex took the joints, 1 its feet settled after an underrun
GOAL_REFUSED = 13       # arg = (type << 8) | goal_refused_reason
CONFIG_MIGRATED = 14
CONFIG_DEFAULTED = 15   # arg = reason
EEPROM_SAVED = 16
TX_DROPPED = 17         # rate-limited
IR_KEY = 18             # arg = NEC command byte | 0x100 for a held-key repeat
POSE_UNDERRUN = 19      # the stream reached its last key with none queued: arg = ticks since the last POSE arrived; the hold starts (link.pose_hold_ticks), then the swing feet settle

[enums.mode]            # TELEMETRY.mode
BOOT = 0
LIMP = 1
IDLE = 2
STREAM = 3              # a POSE stream holds the joints (waiting for its first key, moving, holding or settling)
FALLEN = 5
LOW_BATT = 7
CALIB = 8
LINK_LOST = 9

[enums.owner]           # TELEMETRY.owners nibbles; priority order (higher wins)
IDLE = 0
STREAM = 1              # the POSE stream
REFLEX = 3
PI_HOLD = 4             # head nibble only: the Pi holds the head (SET_HEAD mode=1)

[enums.posture]
LIMP = 0
REST = 1
SIT = 2
STAND = 3
STANCE = 4
CALIB = 5
ZERO = 6

[enums.head_mode]
RELEASE = 0
HOLD = 1

[enums.reset_cause]
COLD = 0
FLASHED = 1
REQUESTED = 2
WARM_UNEXPECTED = 3

[enums.config_state]
OK = 0
MIGRATED = 1
DEFAULTED = 2

[enums.battery_level]   # EVENT LOW_BATTERY arg
WARN = 1
LOW = 2
CRITICAL = 3

# ---------------------------------------------------------------------------
# Bit flags: name = bit number.
[flags.telemetry_flags]
BALANCE_ACTIVE = 0
IMU_FAULT = 1
SERVOS_POWERED = 2
STREAM = 3                     # a POSE stream is on (TELEMETRY mode STREAM)
HEAD_HELD = 5
BATT_WARN = 6
LINK_OK = 7
OVERRUN = 8
NO_BATTERY = 9
EEPROM_PENDING = 10
DIST_FRESH = 11
BALANCE_HELD = 12              # the geometric balance holds its corrections (a support bit clear, and just after; doc §3f)

[flags.hello_caps]
BUZZER = 0
IR = 1
DMP = 2
ULTRASONIC = 3
EYES = 4

[flags.posture_flags]
BALANCE = 0

[flags.support_flags]         # POSE.support, TELEMETRY.support: the feet on the ground
LF = 0
RF = 1
RB = 2
LB = 3

[flags.pose_flags]            # POSE.flags
JOINT_LF = 0                   # this leg's two values are joint angles (shoulder, knee; a16), else a foot (x, z; q2)
JOINT_RF = 1
JOINT_RB = 2
JOINT_LB = 3
BALANCE = 4                    # joint-mode legs: the balance correction in joint space toward pitch/roll while this is the next key (a stream of feet always balances through the feet)
FALL_OK = 5                    # accepted while the fall reflex holds the joints (it lets go), no fall detection while the stream plays: the mind's get-up
EASE = 6                       # reach this key along a cosine ease from the last key (else in a straight line)

[flags.limited_flags]         # TELEMETRY.limited: what the body could not do as asked this tick
LF = 0                         # a joint limit, the slew limit or the leg's reach cut this leg's pose
RF = 1
RB = 2
LB = 3
HEAD = 4                       # a joint limit or the slew limit cut pan, tilt or tail

[flags.eyes_mask]       # SET_EYES led_mask: 0x07 right, 0x38 left, 0x3F all
R0 = 0
R1 = 1
R2 = 2
L0 = 3
L1 = 4
L2 = 5

# ---------------------------------------------------------------------------
[structs.note]          # 2 B
fields = [
  { name = "note", type = "i8", unit = "note", note = "pitch index; mapping fixed by the body buzzer (P1)" },
  { name = "dur_10ms", type = "u8", unit = "ms", scale = 10 },
]

# ---------------------------------------------------------------------------
# Pi -> body (0x01..0x7F)

[[messages]]
name = "HELLO_REQ"
query = true
id = 0x01
dir = "pi_to_body"
kind = "command"
doc = "Ask for HELLO (query)."
fields = []

[[messages]]
name = "HEARTBEAT"
id = 0x02
dir = "pi_to_body"
kind = "goal"
doc = "Keep the link alive."
fields = []

[[messages]]
name = "PING"
query = true
id = 0x03
dir = "pi_to_body"
kind = "command"
doc = "Answered by PONG, for RTT."
fields = [
  { name = "token", type = "u16" },
]

[[messages]]
name = "SET_STREAM"
id = 0x04
dir = "pi_to_body"
kind = "command"
doc = "Telemetry, JOINTS and IMU_RAW divisors of the 50 Hz tick (0 = off)."
fields = [
  { name = "telem_div", type = "u8", note = "0 off, default 2 -> 25 Hz" },
  { name = "joints_div", type = "u8", note = "0 off" },
  { name = "imu_raw_div", type = "u8", note = "0 off" },
]

[[messages]]
name = "STATS_REQ"
query = true
id = 0x05
dir = "pi_to_body"
kind = "command"
doc = "Answered by STATS."
fields = []

[[messages]]
name = "PCA_READ"
query = true
id = 0x06
dir = "pi_to_body"
kind = "command"
doc = "Answered by PCA_COUNTS (debug and calibration checks)."
fields = []

[[messages]]
name = "SET_POSTURE"
id = 0x10
dir = "pi_to_body"
kind = "goal"
epoch = true
doc = "Posture plus transition. LIMP and REST are never stale."
fields = [
  { name = "epoch", type = "u8" },
  { name = "posture", type = "u8", enum = "posture" },
  { name = "transition_ticks", type = "u8", unit = "tick", note = "0 = 25" },
  { name = "flags", type = "u8", flags = "posture_flags" },
]

[[messages]]
name = "POSE"
id = 0x11
dir = "pi_to_body"
kind = "stream"
epoch = true
doc = "One key of the mind's stream of poses (docs/movement-engine.md): the pose the body is to reach by `tick`. The body queues up to link.pose_depth keys in tick order (a second key for a queued tick replaces it) and moves from where it is toward the next one, reaching it exactly on its tick: in a straight line, or along a cosine ease (flag EASE), from the last key reached (for the first key of a stream, from the joints' outputs when it arrived). So keys may come every tick (a walk) or far apart (a slow move, a hold). Every value passes the joint limits and the safety slew (TELEMETRY.limited says what they cut). Each leg is a foot (x, z in q2 = 1/4 mm, through the body's IK, SET_BODY_POSE on top) or, with its JOINT flag, two joint angles (a16); a leg changing between the two moves in joint space. -32768 in a head value leaves that joint to IDLE; the legs are always the stream's. Not acked, not refreshed, not retried. Refused (EVENT GOAL_REFUSED, rate-limited like a goal) BAD_ARG (a foot outside x -480..480, z 60..440 q2, a joint angle of -32768, a pitch or roll beyond +-30 deg, a support bit above 3, an unknown flag), STALE, FALLEN (unless FALL_OK), LOW_BATT, UNCALIBRATED (as STAND), BUSY (another reflex holds the joints, or IDLE is LIMP or CALIB). A key already past, too far ahead or with no room is dropped (STATS pose_dropped). The first key accepted starts the stream (mode STREAM); a stream whose legs are all feet makes IDLE's posture STANCE, as a walk needs. The stream holds the joints until a SET_POSTURE, an epoch bump or a reflex (STREAM_STOPPED arg 0). Reaching its last key with none queued, the body holds it (EVENT POSE_UNDERRUN), and after link.pose_hold_ticks the feet whose support bit is clear settle at their x to the ground (the plane through the support feet when three are down, else their mean depth); a stream of feet then ends in STANCE (STREAM_STOPPED arg 1), one with joint-mode legs keeps holding. Balance: with every leg a foot it corrects through the support feet toward this pitch/roll and holds its corrections while any support bit is clear (TELEMETRY flag BALANCE_HELD; doc §3f); with joint-mode legs it corrects in joint space while the next key has flag BALANCE."
fields = [
  { name = "epoch", type = "u8" },
  { name = "tick", type = "u16", unit = "tick", note = "the body tick by which the pose is reached (TELEMETRY.tick's clock)" },
  { name = "flags", type = "u8", flags = "pose_flags" },
  { name = "leg", type = "i16", count = 8, note = "per leg LF RF RB LB two values: foot x (+ forward of the hip) and z (below the hip) in q2 (1/4 mm), or with the leg's JOINT flag the shoulder and knee angles in a16 (1/16 deg, OpenCat convention)" },
  { name = "head", type = "i16", count = 3, unit = "deg", scale = 0.0625, note = "pan, tilt, tail; -32768 = left to IDLE (the posture, or a SET_HEAD hold)" },
  { name = "pitch", type = "i16", unit = "deg", scale = 0.0625, range = [-480, 480], note = "the attitude the mind predicts at tick: the balance reference (TELEMETRY conventions), +-30 deg" },
  { name = "roll", type = "i16", unit = "deg", scale = 0.0625, range = [-480, 480], note = "+-30 deg" },
  { name = "support", type = "u8", flags = "support_flags", note = "the feet on the ground at tick; the balance corrects through these only" },
]

[[messages]]
name = "SET_HEAD"
id = 0x12
dir = "pi_to_body"
kind = "goal"
epoch = true
doc = "Hold (mode 1) or release (mode 0) pan, tilt, tail. Held joints follow the targets slew-limited at max_speed_dps (0 = only the safety slew) while the head joints' owner is IDLE (not a stream whose pose drives them), without balance corrections; released by mode 0, head_hold_ms without a refresh, or an epoch bump. BAD_ARG for mode > 1; mode 0 is never stale; mode 1: STALE, FALLEN, LOW_BATT. TELEMETRY flags HEAD_HELD, head owner nibble PI_HOLD."
fields = [
  { name = "epoch", type = "u8" },
  { name = "mode", type = "u8", enum = "head_mode" },
  { name = "pan", type = "i16", unit = "deg", scale = 0.0625, note = "-32768 = not held (follows the posture)" },
  { name = "tilt", type = "i16", unit = "deg", scale = 0.0625, note = "-32768 = not held" },
  { name = "tail", type = "i16", unit = "deg", scale = 0.0625, note = "-32768 = not held" },
  { name = "max_speed_dps", type = "u16", unit = "deg/s", note = "0 = no limit below the safety slew" },
]

[[messages]]
name = "SET_BODY_POSE"
id = 0x13
dir = "pi_to_body"
kind = "goal"
epoch = true
doc = "Body pitch, roll, height delta, x-shift (on top of STANCE and of a POSE stream's feet)."
fields = [
  { name = "epoch", type = "u8" },
  { name = "pitch", type = "i16", unit = "deg", scale = 0.0625 },
  { name = "roll", type = "i16", unit = "deg", scale = 0.0625 },
  { name = "dheight_mm", type = "i8", unit = "mm" },
  { name = "xshift_mm", type = "i8", unit = "mm" },
]

[[messages]]
name = "SET_BALANCE"
id = 0x14
dir = "pi_to_body"
kind = "goal"
doc = "Balance enable and gains, live (not persisted; §3f). enable 1 balances eligible postures even without the SET_POSTURE flag. Out of range: GOAL_REFUSED BAD_ARG."
fields = [
  { name = "enable", type = "u8", range = [0, 1] },
  { name = "kp_q8", type = "u8", unit = "1", scale = 0.00390625, note = "default 128 = 0.5" },
  { name = "kd_ms", type = "u8", unit = "ms", note = "default 30" },
  { name = "deadband_deg", type = "u8", unit = "deg", range = [0, 30], note = "default 2" },
  { name = "max_corr_deg", type = "u8", unit = "deg", range = [0, 30], note = "default 15" },
]

[[messages]]
name = "SET_EYES"
id = 0x30
dir = "pi_to_body"
kind = "goal"
doc = "LED mask plus RGB."
fields = [
  { name = "led_mask", type = "u8", flags = "eyes_mask", note = "0x07 right, 0x38 left, 0x3F all" },
  { name = "r", type = "u8" },
  { name = "g", type = "u8" },
  { name = "b", type = "u8" },
]

[[messages]]
name = "BEEP"
id = 0x31
dir = "pi_to_body"
kind = "goal"
doc = "Append 1..8 notes to the buzzer queue."
fields = [
  { name = "n", type = "u8" },
  { name = "notes", type = "note", count_field = "n", min = 1, max = 8 },
]

[[messages]]
name = "CAL_GET"
query = true
id = 0x38
dir = "pi_to_body"
kind = "command"
doc = "Answered by CAL_VALUES."
fields = []

[[messages]]
name = "CAL_SET"
id = 0x39
dir = "pi_to_body"
kind = "command"
doc = "Absolute calibration offset for one joint."
fields = [
  { name = "joint", type = "u8", range = [0, 15] },
  { name = "offset_a16", type = "i16", unit = "deg", scale = 0.0625, range = [-400, 400], note = "absolute, +-25 deg" },
]

[[messages]]
name = "CAL_SAVE"
id = 0x3A
dir = "pi_to_body"
kind = "command"
doc = "Queue a config slot write; acked when queued, EVENT EEPROM_SAVED when written."
fields = []

[[messages]]
name = "CAL_REVERT"
id = 0x3B
dir = "pi_to_body"
kind = "command"
doc = "Reload calibration from the slot."
fields = []

[[messages]]
name = "IMU_OFFSETS_SET"
id = 0x3C
dir = "pi_to_body"
kind = "command"
doc = "Write MPU6050 offsets, optionally persist."
fields = [
  { name = "accel_x", type = "i16" },
  { name = "accel_y", type = "i16" },
  { name = "accel_z", type = "i16" },
  { name = "gyro_x", type = "i16" },
  { name = "gyro_y", type = "i16" },
  { name = "gyro_z", type = "i16" },
  { name = "save", type = "u8", range = [0, 1] },
]

[[messages]]
name = "PARAM_GET"
query = true
id = 0x3D
dir = "pi_to_body"
kind = "command"
doc = "Answered by PARAM_VALUE."
fields = [
  { name = "id", type = "u8" },
]

[[messages]]
name = "PARAM_SET"
id = 0x3E
dir = "pi_to_body"
kind = "command"
doc = "Set a param, optionally persist (acked when queued, EVENT EEPROM_SAVED later)."
fields = [
  { name = "id", type = "u8" },
  { name = "value", type = "i16" },
  { name = "persist", type = "u8", range = [0, 1] },
]

[[messages]]
name = "EEPROM_READ"
query = true
id = 0x3F
dir = "pi_to_body"
kind = "command"
doc = "Answered by EEPROM_DATA."
fields = [
  { name = "addr", type = "u16" },
  { name = "len", type = "u8", range = [1, 56] },
]

[[messages]]
name = "REBOOT"
id = 0x7E
dir = "pi_to_body"
kind = "command"
doc = "Watchdog restart of the application (not the bootloader). magic must be 0x4B49."
fields = [
  { name = "magic", type = "u16", range = [0x4B49, 0x4B49] },
]

# ---------------------------------------------------------------------------
# Body -> Pi (0x80..0xFF)

[[messages]]
name = "HELLO"
id = 0x80
dir = "body_to_pi"
kind = "event"
reply_to = "HELLO_REQ"
doc = "Versions, build hash, reset cause, last alive tick, capabilities, epoch. Also sent unsolicited on boot."
fields = [
  { name = "proto_major", type = "u8" },
  { name = "proto_minor", type = "u8" },
  { name = "fw_build", type = "u32" },
  { name = "reset_cause", type = "u8", enum = "reset_cause" },
  { name = "last_alive_tick", type = "u16", unit = "tick" },
  { name = "caps", type = "u16", flags = "hello_caps" },
  { name = "max_payload", type = "u8" },
  { name = "pose_depth", type = "u8", note = "POSE keys the body queues (link.pose_depth)" },
  { name = "joint_count", type = "u8", note = "driven joints (11)" },
  { name = "config_state", type = "u8", enum = "config_state" },
  { name = "epoch", type = "u8" },
]

[[messages]]
name = "TELEMETRY"
id = 0x81
dir = "body_to_pi"
kind = "stream"
drop_order = 3
doc = "Body state, 25 Hz by default (50 Hz while the mind streams POSE: SET_STREAM telem_div 1)."
fields = [
  { name = "tick", type = "u16", unit = "tick", note = "wraps every 21.8 min" },
  { name = "pitch", type = "i16", unit = "deg", scale = 0.0625, note = "nose down + (legacy ypr), legacy reflection" },
  { name = "roll", type = "i16", unit = "deg", scale = 0.0625, note = "right side up + (legacy ypr)" },
  { name = "rate_pitch", type = "i16", unit = "deg/s", scale = 0.0625 },
  { name = "rate_roll", type = "i16", unit = "deg/s", scale = 0.0625 },
  { name = "rate_yaw", type = "i16", unit = "deg/s", scale = 0.0625 },
  { name = "dist_mm", type = "u16", unit = "mm", note = "0 = no echo" },
  { name = "batt_mv", type = "u16", unit = "mV", note = "filtered" },
  { name = "mode", type = "u8", enum = "mode" },
  { name = "owners", type = "u8", note = "low nibble leg owner, high nibble head owner (enum owner)" },
  { name = "flags", type = "u16", flags = "telemetry_flags" },
  { name = "last_rx_seq", type = "u8" },
  { name = "limited", type = "u8", flags = "limited_flags", note = "the legs (and the head) whose pose a joint limit, the slew limit or the leg's reach cut this tick" },
  { name = "ref_pitch", type = "i16", unit = "deg", scale = 0.0625, note = "the balance reference in use, 0 while the balance is off: in a stream of feet the POSE prediction plus SET_BODY_POSE, in STANCE the pose, with joint-mode legs the POSE prediction, else the posture's" },
  { name = "ref_roll", type = "i16", unit = "deg", scale = 0.0625 },
  { name = "corr_pitch", type = "i16", unit = "deg", scale = 0.0625, note = "the balance correction the legs carry this tick (frozen while BALANCE_HELD; decays to 0 when the balance is off)" },
  { name = "corr_roll", type = "i16", unit = "deg", scale = 0.0625 },
  { name = "pose_queued", type = "u8", note = "POSE keys waiting in the queue (0 outside a stream)" },
  { name = "support", type = "u8", flags = "support_flags", note = "the feet the balance corrects through this tick" },
  { name = "tick_load", type = "u8", unit = "us", scale = 100, note = "max tick time since the last telemetry" },
  { name = "rx_err", type = "u8", note = "cumulative, mod 256" },
  { name = "epoch", type = "u8" },
]

