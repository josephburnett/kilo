# Balance (doc §3f): the body's SET_BALANCE state at boot, and the mind's
# defaults for `kilo balance` / BodyClient.set_balance (which converts Kp and
# Kd from these raw values: Kp = kp_q8 / 256, Kd = kd_ms / 1000 s). Keys are
# the SET_BALANCE field names; all (est.).
#   kp_q8         proportional gain, Q8 (128 = 0.5)
#   kd_ms         rate gain in ms (30 = 0.03 s)
#   deadband_deg  dead band, deg
#   max_corr_deg  correction clamp, deg
#   limit_deg     dead band and clamp above this are BAD_ARG (= the SET_BALANCE ranges' max)
[balance]
kp_q8 = 128
kd_ms = 30
deadband_deg = 2
max_corr_deg = 15
limit_deg = 30

# Head (SET_HEAD, doc §3c layer 1): the mind's defaults and limits.
#   speed_dps  default look() / `kilo head` slew, deg/s (0 = only the body's 500 deg/s safety slew)
#   max_deg    the mind refuses a target beyond +-this (the body clamps to the joint limits anyway)
#   not_held   the i16 a16 value that leaves a joint to its owner (= the body's JOINT_OFF)
[head]
speed_dps = 120
max_deg = 180
not_held = -32768

# ---------------------------------------------------------------------------
# Laptop interface: the host channel (docs/fast-boot.md §5, phase P2).
#
# The mind (the Circle kernel on the Pi, or kilo-mind-host on the laptop)
# listens on one TCP port; the laptop's `kilo --host <ip>` (mind/kilo/hostlink.py)
# connects to it. Nothing here goes over the body's UART: the body never sees
# these messages, and they cost its firmware nothing (types, #defines and
# inline functions it never uses).
#
# Security (version 2; kernel/README.md "Who may talk to Kilo: keys"): every
# byte after the handshake is encrypted and authenticated with the Noise
# protocol host.noise_protocol, pattern KN: the laptop has a static X25519
# key pair, whose public key must be in the list built into the mind
# (kernel/keys/authorized_keys); the mind has no key and no secret. Nothing
# is served without a key, STATUS and the log included; there is no
# plaintext mode.
#   1. Client -> mind, in clear, host.hello_len bytes, then Noise message 1:
#        magic host.hello_magic (4 ASCII) | version u8 (host.version) |
#        flags u8 (0) | reserved u16 (0) | static public key (32)
#        then 32 bytes: -> e (the client's ephemeral key; empty payload)
#      A wrong magic is closed at once, unanswered (a version-1 client's
#      plaintext frame among them).
#   2. Mind -> client, in clear, host.reply_len bytes:
#        magic | version u8 (the mind's) | status u8 (host_hello_status) | reserved u16 (0)
#      then, for OK only, Noise message 2 (48 bytes): <- e, ee, se (an empty
#      payload's tag). Otherwise the mind closes the connection.
#   The Noise prologue is host.noise_prologue (ASCII) followed by the 40
#   hello bytes, and the pre-message (-> s) is the hello's key, so changing
#   any clear byte fails the handshake.
#   3. Then each way a stream of records, each one Noise transport message:
#        len u16 LE | ciphertext (len - 16) | tag (16)       16 <= len <= host.record_max + 16
#      The plaintexts, concatenated, are the frame stream below (a sender puts
#      whole frames in a record; a record may be empty). The client sends its
#      first record at once (an empty one will do): only a record that
#      authenticates proves it holds the private key (KN authenticates the
#      initiator then), and until then the connection is not a client: it
#      sees nothing, counts for nothing (STATUS.clients, control) and is
#      closed host.handshake_timeout_ms after it connected. A record that
#      does not authenticate, a bad length, or a nonce at 2^62 closes the
#      connection, unanswered.
#   Slots: the mind keeps at most host.max_clients connections; a new one
#   always gets in, closing the oldest connection that is not yet a client
#   if it must; with max_clients clients it is closed at once.
#
# Framing (TCP is a reliable byte stream, so no COBS and no delimiter):
#     len u16 LE | type u8 | seq u8 | payload (0..host.max_payload) | crc16 u16 LE
#   len counts the bytes after itself (2 + payload + 2). crc16 is the body
#   link's CRC-16/CCITT-FALSE (link.crc_*) over type, seq, payload. A length
#   outside 4..host.max_frame - 2 or a bad CRC means the stream is out of
#   step: the receiver closes the connection (there is no resync). A good CRC
#   with a payload length wrong for its type, or an unknown type, is answered
#   RESULT BAD_LEN / UNKNOWN_TYPE.
#
# Ids: client -> mind 0x01..0x7F, mind -> client 0x80..0xFF, as on the body
# link but a separate namespace (C KILO_HOST_MSG_*, Python HostMsgId).
# Kinds: command = client -> mind, answered by exactly one reply carrying its
#                  seq: the message whose reply_to names it, else RESULT;
#        stream  = one-way, never answered (KEEPALIVE, BRIDGE_TX, TELEM, ...);
#        event   = mind -> client reply (RESULT, STATUS).
# 0x40..0x4F and 0xC0..0xCF are the image channel: FLASH_* (the body's
# firmware, P4, §6) and UPDATE_* (the mind's own kernel on its SD card); only
# they may use them (gen.py checks).
#
# Rules: any number of clients up to host.max_clients; each may read STATUS
# and subscribe to TELEM and LOG_LINE. One controller at a time: the first to
# send CONTROL take=1. POSTURE, PARAM_SET, REBOOT and the bridge need control
# (others get NOT_CONTROLLER). When the controller lets go (CONTROL take=0),
# closes its socket, or asked for keepalive and was silent for
# host.keepalive_timeout_ms, the mind closes the bridge if it was open and
# latches SET_POSTURE REST (Python counterpart: a client's hold ending in the
# daemon, kilo/daemon/sessions.py).
#
# Raw bridge: BRIDGE_OPEN pauses the mind's link (no heartbeat, goal or
# command goes out) and forwards UART bytes both ways in BRIDGE_TX/BRIDGE_RX,
# so a laptop tool speaks the body protocol itself (kilo.hostlink's
# BridgeTransport under kilo.link). BRIDGE_CLOSE (or losing control) resumes
# the link, which reconnects (HELLO_REQ). While bridged the body's watchdog
# applies as usual.
#
# Reboot: REBOOT restarts the mind, so a developer gets the SD card's
# netboot loader back without pulling the Pi's power. The mind latches REST
# on the link (as when the controller lets go), answers RESULT OK, sends it,
# then reboots (the Circle kernel: within about 200 ms; kilo-mind-host exits
# with its own status instead). The client sees OK, then the connection drop.
#
# Flash (P4, docs/fast-boot.md §6): the controller sends FLASH_BEGIN (the
# manifest: build, image_size, crc32, flags), the image in FLASH_DATA chunks in
# order, then FLASH_COMMIT. The mind checks size and CRC-32 (zlib's) and
# answers COMMIT with RESULT OK (flashing has started) or IMAGE_BAD; then it
# pauses its link as the bridge does, resets the body into optiboot (GPIO4)
# and programs it over STK500v1 at host.flash_baud, reporting FLASH_STATUS to
# that client at each step and page, and last DONE (the body's HELLO after
# the flash has fw_build == build) or FAILED with an error. Any failure puts
# the link back at the link baud. While flashing, POSTURE, PARAM_SET, the
# bridge and another FLASH_BEGIN get FLASHING. Losing control while
# receiving drops the image; once flashing it runs to the end.
#
# Kernel update: the controller sends UPDATE_BEGIN (image_size, crc32, flags),
# the mind kernel image in UPDATE_DATA chunks in order, then UPDATE_COMMIT.
# The mind checks size, CRC-32 and (unless flags FORCE) that host.update_marker
# is in the image, so that only a mind kernel is installed, and answers
# COMMIT with RESULT OK (writing has started) or IMAGE_BAD. It then pauses its
# link as for a flash and writes the image to its SD card's FAT partition as
# kernel7.new, reads it back and compares the CRC-32, and only then removes
# kernel7.old, renames kernel7.img to kernel7.old and kernel7.new to
# kernel7.img. UPDATE_STATUS goes to that client at each phase and slice, and
# last DONE or FAILED; a failure before the renames leaves kernel7.img as it
# was. After DONE the mind does what REBOOT does (REST, then restart) and the
# Pi boots the new kernel. A body flash and a kernel update exclude each
# other (FLASHING, UPDATING); while the update writes, POSTURE, PARAM_SET,
# REBOOT and the bridge get UPDATING.
#
# The flight recorder (kernel/mind/record/, kernel/README.md "The flight
# recorder"): from boot the mind records, in a RAM ring of
# host.record_block_bytes blocks, every body link frame both ways (TELEMETRY,
# EVENT, JOINTS in; FEET, goals, commands out; HEARTBEAT only counted, in
# record_block_header.skipped), every log line (LOG, the status lines
# included), and during a walk each planned tick (walk_plan), the planner's
# counters when they move (walk_planner) and MARK lines (the walk's
# parameters, changes, its end); during a trick MARK lines (the trick, its
# keyframes' timing, the end). A block is a record_block_header and records
# (walk_record_header: kind, len, t_us since the block's t0, then the
# payload); when the ring is full the oldest block goes. A run (a walk or a
# trick) is a span of this one stream: RUN records (run_mark) open and close
# it. WALK_LIST lists the runs (this boot's from RAM, earlier boots' from the
# SD card's index, EARLIER_BOOT); WALK_FETCH sends the blocks from
# host.walk_preroll_ms before a run's start to host.walk_postroll_ms after its
# end; REC_FETCH sends the blocks of any time range (this boot's from RAM, an
# earlier boot's from the card), or an earlier boot's saved log. Both stream
# WALK_DATA chunks that wait for room in the client's send ring (a slow laptop
# slows the download, never the link); host.walk_format numbers the bytes'
# layout. Any client may list and fetch (they only read). Saving to the SD
# card (REC_SAVE; off unless switched on: the card's write times stall the
# loop) writes sealed blocks, the run index and the log at safe moments only
# (no walk or trick, the body not moving), host.record_write_chunk at most
# per pass; a write slower than host.record_slow_write_ms makes it back off.
# A run being recorded is not fetchable (RECORDING), and while one is
# recorded a download goes at one chunk a pass.
#
# Version: host.version changes when a message's layout or meaning changes.
# New message types do not bump it: a mind without them answers RESULT
# UNKNOWN_TYPE, which a client reports as "not supported by this mind"
# (WALK_* came after version 2 so).
#
# Addressing (decided in P2): on a direct cable nothing serves DHCP. The mind
# asks DHCP for host.dhcp_timeout_ms; with no lease it takes the fixed
# link-local address host.fallback_ip/host.fallback_prefix (169.254.75.73,
# "KI"). The laptop sets its cable interface to link-local
# (NetworkManager "Link-Local Only", or `ip addr add 169.254.1.1/16 dev IF`)
# and runs `kilo --host 169.254.75.73`. On a LAN with DHCP the lease wins.
[host]
version = 2                    # host channel protocol version (STATUS.host_version, the hello's); bump on any layout change. 2: Noise
port = 5300                    # TCP
noise_protocol = "Noise_KN_25519_ChaChaPoly_BLAKE2b"  # Noise revision 34 name of the handshake and transport
noise_prologue = "kilo-host-2" # then the 40 hello bytes: the Noise prologue
hello_magic = "KILO"           # the first 4 bytes each way
hello_len = 40                 # B: the client's clear hello (magic, version, flags, reserved, static public key)
reply_len = 8                  # B: the mind's clear answer (magic, version, status, reserved)
record_max = 1024              # B: a record's plaintext at most (the tag adds 16)
handshake_timeout_ms = 3000    # a connection that sent no authenticated record by then is closed
max_payload = 240              # bytes
max_frame = 246                # len (2) + type, seq (2) + max_payload + crc (2)
max_clients = 4                # connections the mind serves at once; more are closed at accept
keepalive_timeout_ms = 2000    # a controller that asked for keepalive and sent nothing for this long loses control
keepalive_send_ms = 500        # how often the client sends KEEPALIVE (or anything)
telem_max_hz = 50              # TELEM_SUB hz range: 1..this (0 = off)
log_text_max = 159             # LOG_LINE text bytes (the mind's log line, 160 with its null)
log_ring_lines = 4096          # lines of history the mind's RAM log keeps (LOG_SUB tail 255: all of them); status lines are not history
bridge_chunk_max = 200         # BRIDGE_TX / BRIDGE_RX data bytes per frame
dhcp_timeout_ms = 3000         # the mind's wait for a DHCP lease before the link-local fallback
fallback_ip = [169, 254, 75, 73]
fallback_prefix = 16
flash_max_image = 32256        # B: the ATmega328P's 32 KB less optiboot's 512 B (FLASH_BEGIN.image_size)
flash_page = 128               # B: the 328P's flash page (one STK500 PROG_PAGE / READ_PAGE)
flash_chunk_max = 200          # FLASH_DATA data bytes per frame (as the bridge)
flash_baud = 115200            # optiboot's UART rate (the link's is link.baud)
update_max_image = 4194304     # B: the largest mind kernel UPDATE_BEGIN.image_size may give (the Circle kernel's buffer, 4 MB)
update_chunk_max = 200         # UPDATE_DATA data bytes per frame (as FLASH_DATA)
update_marker = "KILO-MIND-KERNEL-1"  # must be in an image UPDATE_COMMIT installs unless FORCE: the mind kernel embeds it (kernel/src/kernel.cpp), the netboot loader does not
walk_format = 2                # WALK_DATA's bytes: 2 = flight-recorder blocks (record_block_header + records; 1 was a walk's records alone); bump on any change
walk_text_max = 120            # WALK_INFO text bytes
cal_save_wait_ms = 2000        # CAL SAVE: the wait for the body's EEPROM_SAVED before CAL_STATUS (saved 0 after it)
walk_chunk_max = 200           # WALK_DATA data bytes per frame
walk_preroll_ms = 2000         # a recording starts with this much of the link's traffic before the walk's setup
walk_postroll_ms = 2000        # ... and runs on this long after the walk ended
record_block_bytes = 16384     # B: one flight-recorder block, its header included
record_block_magic = 826427979 # record_block_header.magic: 0x3152464B, "KFR1" little-endian
record_write_chunk = 4096      # B: the most the card saver writes in one pass of the main loop
record_slow_write_ms = 100     # a card write (or sync, close) slower than this: a warning, and saving backs off
record_card_cap_mb = 64        # MB of recordings the card keeps (the oldest blocks' files go first)

[enums.host_result_code]       # RESULT.code
OK = 0
UNSUPPORTED = 1                # known request, not implemented by this mind yet
NOT_CONTROLLER = 2             # needs control (CONTROL take=1), which this client does not have
BAD_ARG = 3
BAD_LEN = 4                    # payload length wrong for the type (CRC good)
UNKNOWN_TYPE = 5
NO_BODY = 6                    # the link is down, or the body speaks another protocol major
BUSY = 7                       # CONTROL take=1 while another client has control
BRIDGED = 8                    # refused while the raw bridge is open
NOT_BRIDGED = 9                # BRIDGE_CLOSE without an open bridge
IMAGE_BAD = 10                 # FLASH_COMMIT: the image does not check (FLASH_STATUS.error says why); FLASH_BEGIN: a bad manifest
FLASHING = 11                  # refused while the body is being flashed
UPDATING = 12                  # refused while the mind writes a new kernel to its SD card (UPDATE_COMMIT until DONE or FAILED)

[enums.host_hello_status]      # the mind's clear answer to the hello
OK = 0                         # Noise message 2 follows
KEY_UNKNOWN = 1                # the hello's public key is not in the mind's list (kernel/keys/authorized_keys)
BAD_VERSION = 2                # the hello's version is not the mind's (its own follows in the answer)
REFUSED = 3                    # no handshake now (the mind has no randomness): try again later

[enums.host_controller]        # STATUS.controller, as seen by the asking client
NONE = 0
YOU = 1
OTHER = 2

[enums.log_level]              # LOG_LINE.level, LOG_SUB.min_level (kernel/mind/platform.h LogLevel)
DEBUG = 0
INFO = 1
WARN = 2
ERROR = 3

[flags.host_state]             # STATUS.state, TELEM.state
LINK_CONNECTED = 0             # the mind's end of the body link is open
BODY_ALIVE = 1                 # a TELEMETRY less than link.body_lost_ms old
HAS_HELLO = 2
HAS_TELEMETRY = 3
CONTACT = 4                    # the body was heard on this connection: motion goals may go out
BRIDGE = 5                     # the raw bridge is open (the link is paused)
CONTROLLED = 6                 # some client has control
FLASHING = 7                   # the body is being flashed (the link is paused until the body boots)

[enums.flash_phase]            # FLASH_STATUS.phase
IDLE = 0
RECEIVING = 1                  # FLASH_BEGIN accepted, FLASH_DATA arriving
RESETTING = 2                  # GPIO4 low (host.flash_baud set)
SYNCING = 3                    # STK500 GET_SYNC until optiboot answers
PROGRAMMING = 4                # LOAD_ADDRESS + PROG_PAGE, page of pages
VERIFYING = 5                  # LOAD_ADDRESS + READ_PAGE, page of pages
BOOTING = 6                    # LEAVE_PROGMODE done, link baud back: waiting for the new firmware's HELLO
DONE = 7                       # HELLO.fw_build == build
FAILED = 8                     # error says why; the link is back

[enums.flash_error]            # FLASH_STATUS.error
NONE = 0
BAD_SIZE = 1                   # FLASH_BEGIN.image_size 0 or > host.flash_max_image
BAD_BUILD = 2                  # FLASH_BEGIN.build 0
BAD_OFFSET = 3                 # FLASH_DATA out of order or past size
SHORT = 4                      # FLASH_COMMIT before image_size bytes arrived
CRC_MISMATCH = 5               # the image's CRC-32 is not FLASH_BEGIN.crc32
SYNC_TIMEOUT = 6               # optiboot never answered GET_SYNC (every attempt)
NO_REPLY = 7                   # an STK500 command got no (complete) answer in time
BAD_REPLY = 8                  # an answer that is not STK_INSYNC ... STK_OK
BAD_SIGNATURE = 9              # READ_SIGN is not the ATmega328P's 1E 95 0F
VERIFY_MISMATCH = 10           # READ_PAGE differs from what was programmed
SERIAL = 11                    # the UART failed
BAUD = 12                      # the UART cannot be set to host.flash_baud or back
NO_HELLO = 13                  # no HELLO from the body after the flash
WRONG_BUILD = 14               # HELLO.fw_build after the flash is not build
BAD_RESET_CAUSE = 15           # HELLO.reset_cause after the flash is not FLASHED
CONTROL_LOST = 16              # the controller let go while receiving: the image is dropped

[flags.flash_flags]            # FLASH_BEGIN.flags
PERSIST = 0                    # after DONE the platform writes body.bin + body.json to SD (kernel/mind/README.md "Flashing")

[enums.update_phase]           # UPDATE_STATUS.phase
IDLE = 0
RECEIVING = 1                  # UPDATE_BEGIN accepted, UPDATE_DATA arriving
CHECKING = 2                   # UPDATE_COMMIT: size, CRC-32, host.update_marker
WRITING = 3                    # kernel7.new on the SD card: done of image_size bytes
VERIFYING = 4                  # kernel7.new read back: done of image_size bytes, then its CRC-32 compared
INSTALLING = 5                 # kernel7.old removed, kernel7.img -> kernel7.old, kernel7.new -> kernel7.img
DONE = 6                       # installed: the mind reboots into it (REST to the body first)
FAILED = 7                     # error says why

[enums.update_error]           # UPDATE_STATUS.error
NONE = 0
BAD_SIZE = 1                   # UPDATE_BEGIN.image_size 0 or over the mind's buffer (host.update_max_image at most)
BAD_OFFSET = 2                 # UPDATE_DATA out of order or past image_size
SHORT = 3                      # UPDATE_COMMIT before image_size bytes arrived
CRC_MISMATCH = 4               # the image's CRC-32 is not UPDATE_BEGIN.crc32
NOT_A_KERNEL = 5               # no host.update_marker in the image (and no FORCE): not the mind kernel
WRITE_FAILED = 6               # creating or writing kernel7.new failed (no card?); kernel7.img unchanged
VERIFY_FAILED = 7              # kernel7.new read back is not the image (size or CRC-32); kernel7.img unchanged
INSTALL_FAILED = 8             # a remove or rename failed; kernel7.img is the old kernel (put back if it had been moved)
CARD_BROKEN = 9                # kernel7.img moved away, the new one not installed, and putting the old one back failed: rewrite the card in a reader

[flags.update_flags]           # UPDATE_BEGIN.flags
FORCE = 0                      # skip the host.update_marker check: install any image (e.g. the netboot loader back)

[flags.walk_flags]             # WALK_INFO.flags
RECORDING = 0                  # still being recorded (the run, or its host.walk_postroll_ms): not fetchable yet
ENDED_OK = 1                   # the run ended as asked (a walk's planned stop or the remote's freeze; a trick's TRICK_DONE DONE)
TRUNCATED = 2                  # its start is no longer in RAM (the ring overwrote it) nor on the card
STREAMED = 3                   # FEET went out (else it ended in its setup); a trick: TRICK_PLAY was acknowledged
TRICK = 4                      # a trick run (else a walk)
SAVED = 5                      # its blocks are on the SD card
EARLIER_BOOT = 6               # from an earlier boot (the card's index): id is boot << 20 | its id in that boot

[enums.walk_data_status]       # WALK_DATA.status
DATA = 0                       # data at offset
END = 1                        # no data: offset == total, the whole walk is sent
GONE = 2                       # no data: the walk was dropped (the store needed room) before it was all sent

[enums.walk_record]            # walk_record_header.kind: the records of a walk recording
RX = 1                         # a body link frame the mind received: type u8, seq u8, then its payload
TX = 2                         # a body link frame the mind wrote (FEET, goals, commands, HEARTBEAT): type, seq, payload
PLAN = 3                       # walk_plan: one tick the planner planned, sent as FEET or skipped
PLANNER = 4                    # walk_planner: the planner's hold, catch or wait counters moved
MARK = 5                       # ASCII "word key=value ...": walk, setup, stream, config, model, change, stop, end, result; trick, frames, play, key, end
LOG = 6                        # one log line: level u8 (enum log_level), then its text (no null)
RUN = 7                        # run_mark: a run began or ended

[enums.run_kind]               # run_mark.kind
WALK = 1
TRICK = 2

[enums.run_event]              # run_mark.event
BEGIN = 1                      # the run starts here (a walk's setup, a trick's start)
END = 2                        # its end (its post-roll follows)

[enums.record_card_state]      # REC_STATUS.card_state
NONE = 0                       # no SD card (or it did not mount)
OFF = 1                        # saving is off (REC_SAVE 1 turns it on)
IDLE = 2                       # on, nothing to save or waiting for a safe moment
SAVING = 3                     # writing, a chunk a pass
BACKOFF = 4                    # a write was slow or failed: waiting before the next
FAILED = 5                     # the card refused too often: saving stopped until REC_SAVE

[enums.guard_zone]             # GUARD_STATUS.zone
GREEN = 0                      # clear (or nothing seen)
BLUE = 1                       # too close: a forward walk stops, Kilo sits
RED = 2                        # very close: a forward walk backs off first

[enums.guard_eyes]             # GUARD_STATUS.eyes: the colour the mind asks for
GREEN = 0                      # clear (or nothing seen)
BLUE = 1                       # too close
RED = 2                        # very close
ORANGE = 3                     # low battery: Kilo is tired (the battery at rest below the low mark, or the body's LOW_BATT) and the zone is green; blue and red win over it

[enums.guard_action]           # GUARD_STATUS.action
WATCH = 0                      # nothing to do
STOPPING = 1                   # the planned stop of a forward walk
BACKING = 2                    # walking backward a short way (RED)
HOLDING = 3                    # sitting; forward keys refused until clear

[enums.cal_op]                 # CAL.op, CAL_STATUS.op
GET = 0                        # read the 16 offsets (CAL_GET)
SET = 1                        # one joint's absolute offset (CAL_SET), then read them
SAVE = 2                       # write the calibration to the EEPROM slot (CAL_SAVE), wait for EEPROM_SAVED, then read
REVERT = 3                     # reload the saved calibration (CAL_REVERT), then read

[enums.sound_op]               # SOUND.op
STATUS = 0                     # only ask
PLAY = 1                       # play name (a sound, or a family: "meow" picks one of meow1, meow2, ...)
ON = 2                         # sounds on (the kernel's default)
OFF = 3                        # sounds off: every play request is refused and counted
VOLUME = 4                     # the software volume, 0..100 (SOUND.volume)

[enums.sound_result]           # SOUND_STATUS.result: what the SOUND did
OK = 0                         # done (STATUS, ON, OFF, VOLUME)
QUEUED = 1                     # PLAY: it plays once nothing else does and the gap since the last sound has passed
UNKNOWN = 2                    # PLAY: no sound or family of that name in the image
OFF = 3                        # PLAY: sounds are off
NO_SOUNDS = 4                  # PLAY: the image has no sounds (none were packed, or built with KILO_SOUND=0)
ASLEEP = 5                     # PLAY: light sleep (the output is stopped); dropped

[enums.sound_state]            # SOUND_STATUS.state: the output
NONE = 0                       # no sound output (built with KILO_SOUND=0, or no device)
IDLE = 1                       # nothing playing
PLAYING = 2                    # a sound is playing (or fading out)
ASLEEP = 3                     # light sleep: the output is silenced and stopped
FAILED = 4                     # the device failed to start (DMA): nothing plays

[enums.rec_fetch_what]         # REC_FETCH.what
BLOCKS = 0                     # the flight recorder's blocks covering the range
LOG = 1                        # the boot's saved log (text lines "t_ms L text"), the range ignored

[structs.record_block_header]  # 36 B at the start of every flight-recorder block
fields = [
  { name = "magic", type = "u32", note = "host.record_block_magic" },
  { name = "boot", type = "u32", note = "the boot's number on the card (0: not known, the card not read yet)" },
  { name = "seq", type = "u32", note = "the block's number in its boot, 0.." },
  { name = "used", type = "u32", unit = "B", note = "bytes of this block, the header included" },
  { name = "t0_us_lo", type = "u32", unit = "us", note = "the mind's clock at the block's start, low half (records' t_us count from it)" },
  { name = "t0_us_hi", type = "u32", unit = "us", note = "... high half" },
  { name = "records", type = "u32" },
  { name = "skipped", type = "u32", note = "HEARTBEAT frames sent in this block's time (counted, not stored)" },
  { name = "crc32", type = "u32", note = "CRC-32 of the bytes after the header; 0: the block is still being written" },
]

[structs.run_mark]             # 6 B: RUN
fields = [
  { name = "id", type = "u32", note = "the run's id (WALK_INFO.id)" },
  { name = "kind", type = "u8", enum = "run_kind" },
  { name = "event", type = "u8", enum = "run_event" },
]

[structs.walk_record_header]   # 6 B before each record's payload (WALK_DATA's bytes are these records, in order)
fields = [
  { name = "kind", type = "u8", note = "enum walk_record" },
  { name = "len", type = "u8", unit = "B", note = "payload bytes after this header" },
  { name = "t_us", type = "u32", unit = "us", note = "mind time since the walk's t0 (its first MARK: t0_us)" },
]

[structs.walk_plan]            # 17 B: PLAN, what the planner made of one tick (the FEET frame carries the rest)
fields = [
  { name = "tick", type = "u32", unit = "tick", note = "the body tick, unwrapped (FEET.tick is its low 16 bits)" },
  { name = "sent", type = "u8", note = "1 = written as FEET; 0 = already past when planned (skipped), or the link did not take it" },
  { name = "lifting", type = "u8", note = "bit i: leg i in the air (swinging) this tick" },
  { name = "support", type = "u8", note = "flags support_flags: the feet on the ground" },
  { name = "margin", type = "i16", unit = "0.1 mm", note = "the centre of mass inside the polygon of the feet down (- = outside); -32768 = none. The planner's min_margin counts ticks with one leg up only" },
  { name = "plan_pitch", type = "i16", unit = "a16", note = "the attitude these feet give, no servo lag" },
  { name = "plan_roll", type = "i16", unit = "a16" },
  { name = "pitch", type = "i16", unit = "a16", note = "predicted at this tick, servo lag included (FEET.pitch before its clamp)" },
  { name = "roll", type = "i16", unit = "a16" },
]

[structs.walk_planner]         # 18 B: PLANNER, written when a counter moved (at most once per planned tick)
fields = [
  { name = "tick", type = "u32", unit = "tick", note = "the tick being planned" },
  { name = "holds", type = "u32", note = "ticks a lift waited because the body was off the plan by more than gate_deg" },
  { name = "catches", type = "u32", note = "swinging legs landed at once: the body tipped toward them by catch_deg" },
  { name = "waits", type = "u32", note = "ticks a slot waited for its lean's solve to finish" },
  { name = "min_margin", type = "i16", unit = "0.1 mm", note = "the smallest margin so far; -32768 = none yet" },
]

[structs.host_link_stats]      # 80 B: the mind's link counters (kernel/mind/link/stats.h; kilo/body/state.py LinkStats)
fields = [
  { name = "frames_rx", type = "u32" },
  { name = "frames_tx", type = "u32" },
  { name = "bytes_rx", type = "u32" },
  { name = "bytes_tx", type = "u32" },
  { name = "decode_errors", type = "u32", note = "all kinds" },
  { name = "crc_errors", type = "u32" },
  { name = "heartbeats", type = "u32" },
  { name = "goal_sends", type = "u32" },
  { name = "commands", type = "u32" },
  { name = "retries", type = "u32" },
  { name = "timeouts", type = "u32" },
  { name = "nacks", type = "u32" },
  { name = "dup_acks", type = "u32" },
  { name = "tx_dropped", type = "u32" },
  { name = "tx_short", type = "u32" },
  { name = "reconnects", type = "u32" },
  { name = "disconnects", type = "u32" },
  { name = "goals_refused", type = "u32" },
  { name = "goals_cleared", type = "u32" },
  { name = "hello_polls", type = "u32" },
]

# Host messages: as [[messages]], with dir client_to_mind or mind_to_client,
# plus fixed fields whose type is a [structs.*] entry or a fixed-length body
# message (HELLO, TELEMETRY, EVENT: its payload embedded whole).

[[host_messages]]
name = "STATUS_REQ"
id = 0x01
dir = "client_to_mind"
kind = "command"
query = true
doc = "Answered by STATUS. Any client."
fields = []

[[host_messages]]
name = "CONTROL"
id = 0x02
dir = "client_to_mind"
kind = "command"
doc = "Take (1) or give up (0) control. BUSY when another client has it. Giving it up latches REST. keepalive 1: lose control after host.keepalive_timeout_ms without any message from this client."
fields = [
  { name = "take", type = "u8", range = [0, 1] },
  { name = "keepalive", type = "u8", range = [0, 1] },
]

[[host_messages]]
name = "KEEPALIVE"
id = 0x03
dir = "client_to_mind"
kind = "stream"
doc = "Nothing but proof of life (any message counts). Not answered."
fields = []

[[host_messages]]
name = "POSTURE"
id = 0x10
dir = "client_to_mind"
kind = "command"
doc = "Latch SET_POSTURE on the body link (controller only). OK means latched: the link sends it once the body is heard, and the body may still refuse it (EVENT GOAL_REFUSED in TELEM.last_event)."
fields = [
  { name = "posture", type = "u8", enum = "posture" },
  { name = "transition_ticks", type = "u8", unit = "tick", note = "0 = 25" },
  { name = "flags", type = "u8", flags = "posture_flags" },
]

[[host_messages]]
name = "PARAM_GET"
id = 0x11
dir = "client_to_mind"
kind = "command"
doc = "Read a body param (PARAM_GET on the link). RESULT UNSUPPORTED until P3."
fields = [
  { name = "id", type = "u8" },
]

[[host_messages]]
name = "PARAM_SET"
id = 0x12
dir = "client_to_mind"
kind = "command"
doc = "Set a body param (controller only). RESULT UNSUPPORTED until P3."
fields = [
  { name = "id", type = "u8" },
  { name = "value", type = "i16" },
  { name = "persist", type = "u8", range = [0, 1] },
]

[[host_messages]]
name = "REBOOT"
id = 0x13
dir = "client_to_mind"
kind = "command"
doc = "Reboot the mind (controller only): latch REST on the link, answer RESULT OK, then restart (the Pi re-enters the SD card's boot, e.g. the netboot loader; kilo-mind-host exits). FLASHING while a flash runs, UPDATING while a kernel update writes. The connection then drops."
fields = []

[[host_messages]]
name = "TELEM_SUB"
id = 0x20
dir = "client_to_mind"
kind = "command"
doc = "TELEM to this client at hz (1..host.telem_max_hz; 0 = off). Any client."
fields = [
  { name = "hz", type = "u8", unit = "Hz", range = [0, 50] },
]

[[host_messages]]
name = "LOG_SUB"
id = 0x21
dir = "client_to_mind"
kind = "command"
doc = "LOG_LINE to this client: first up to `tail` lines of history still in the mind's ring (255: all it keeps, host.log_ring_lines), then every new line, the status lines included, at min_level and above. enable 0 stops. Any client."
fields = [
  { name = "enable", type = "u8", range = [0, 1] },
  { name = "tail", type = "u8", note = "lines of history; 255 = all" },
  { name = "min_level", type = "u8", enum = "log_level" },
]

[[host_messages]]
name = "BRIDGE_OPEN"
id = 0x30
dir = "client_to_mind"
kind = "command"
doc = "Pause the mind's link and forward UART bytes both ways (controller only)."
fields = []

[[host_messages]]
name = "BRIDGE_TX"
id = 0x31
dir = "client_to_mind"
kind = "stream"
doc = "Bytes for the body's UART, written as they are. Not answered; dropped when the bridge is closed or the sender is not the controller."
fields = [
  { name = "data", type = "bytes", min = 1, max = 200 },
]

[[host_messages]]
name = "BRIDGE_CLOSE"
id = 0x32
dir = "client_to_mind"
kind = "command"
doc = "Resume the mind's link (it reconnects: HELLO_REQ). Controller only."
fields = []

[[host_messages]]
name = "FLASH_BEGIN"
id = 0x40
dir = "client_to_mind"
kind = "command"
doc = "Start receiving a body image (controller only): its manifest. Drops any image received before. RESULT IMAGE_BAD for an image_size of 0 or over host.flash_max_image, or build 0; FLASHING while a flash runs; UPDATING while a kernel update runs; BRIDGED while the bridge is open."
fields = [
  { name = "build", type = "u32", note = "the image's -DKILO_BUILD (commit hash, 8 hex digits): HELLO.fw_build after the flash" },
  { name = "image_size", type = "u32", unit = "B", range = [1, 32256], note = "bytes of body.bin" },
  { name = "crc32", type = "u32", note = "CRC-32 of the image (zlib.crc32)" },
  { name = "flags", type = "u8", flags = "flash_flags" },
]

[[host_messages]]
name = "FLASH_DATA"
id = 0x41
dir = "client_to_mind"
kind = "stream"
doc = "The next bytes of the image, in order from offset 0. Not answered; an offset that is not the bytes received so far (or data past image_size) fails the image, which FLASH_COMMIT then reports (BAD_OFFSET). Dropped unless from the client that sent FLASH_BEGIN."
fields = [
  { name = "offset", type = "u32", unit = "B" },
  { name = "data", type = "bytes", min = 1, max = 200 },
]

[[host_messages]]
name = "FLASH_COMMIT"
id = 0x42
dir = "client_to_mind"
kind = "command"
doc = "Check the received image (size, CRC-32) and flash it. RESULT OK: flashing has started, FLASH_STATUS follows to this client until DONE or FAILED; IMAGE_BAD: the image is dropped, a FLASH_STATUS FAILED says why."
fields = []

[[host_messages]]
name = "UPDATE_BEGIN"
id = 0x48
dir = "client_to_mind"
kind = "command"
doc = "Start receiving a mind kernel image for the SD card (controller only). Drops any image received before. RESULT IMAGE_BAD for an image_size of 0 or over the mind's buffer; FLASHING while a body flash runs or its image waits for SD; UPDATING while an update writes; BRIDGED while the bridge is open; UNSUPPORTED on a mind with no kernel store (kilo-mind-host without --card)."
fields = [
  { name = "image_size", type = "u32", unit = "B", range = [1, 4194304], note = "bytes of kernel7.img" },
  { name = "crc32", type = "u32", note = "CRC-32 of the image (zlib.crc32)" },
  { name = "flags", type = "u8", flags = "update_flags" },
]

[[host_messages]]
name = "UPDATE_DATA"
id = 0x49
dir = "client_to_mind"
kind = "stream"
doc = "The next bytes of the kernel image, in order from offset 0. Not answered; an offset that is not the bytes received so far (or data past image_size) fails the image, which UPDATE_COMMIT then reports (BAD_OFFSET). Dropped unless from the client that sent UPDATE_BEGIN."
fields = [
  { name = "offset", type = "u32", unit = "B" },
  { name = "data", type = "bytes", min = 1, max = 200 },
]

[[host_messages]]
name = "UPDATE_COMMIT"
id = 0x4A
dir = "client_to_mind"
kind = "command"
doc = "Check the received image (size, CRC-32, and unless FORCE host.update_marker) and install it on the SD card. RESULT OK: writing has started, UPDATE_STATUS follows to this client until DONE (then the mind reboots into it: REST to the body, the connection drops) or FAILED; IMAGE_BAD: the image is dropped, an UPDATE_STATUS FAILED says why."
fields = []

[[host_messages]]
name = "WALK_LIST"
id = 0x50
dir = "client_to_mind"
kind = "command"
query = true
doc = "Answered by WALK_INFO: the oldest recorded walk with an id above `after` (0: the oldest kept), or found 0. Any client; a client lists every walk by asking again with the id it got."
fields = [
  { name = "after", type = "u32", note = "a walk id; 0 = from the oldest" },
]

[[host_messages]]
name = "WALK_FETCH"
id = 0x51
dir = "client_to_mind"
kind = "command"
doc = "Send walk `id`'s recording to this client from `offset`, as WALK_DATA frames, as fast as its connection takes them (never more than host.walk_chunk_max a frame, a few frames a pass; one a pass while a walk is being recorded). RESULT OK, then the data, then one WALK_DATA END (or GONE). BAD_ARG: no such walk, or it is still RECORDING, or offset past its end. id 0 stops this client's fetch (RESULT OK). A new WALK_FETCH replaces the one running. Any client."
fields = [
  { name = "id", type = "u32" },
  { name = "offset", type = "u32", unit = "B", note = "bytes of the recording already received (a resumed fetch)" },
]

[[host_messages]]
name = "REC_STATUS_REQ"
id = 0x52
dir = "client_to_mind"
kind = "command"
query = true
doc = "Answered by REC_STATUS: the flight recorder and the card saver. Any client."
fields = []

[[host_messages]]
name = "REC_FETCH"
id = 0x53
dir = "client_to_mind"
kind = "command"
doc = "Send the flight recorder's blocks from from_ms to to_ms (that boot's mind clock, REC_STATUS.clock_ms; to_ms 0xFFFFFFFF: up to now) as WALK_DATA id 0, or (what LOG) an earlier boot's saved log. RESULT OK (text: what is sent), the data, one WALK_DATA END (or GONE). BAD_ARG: nothing in the range. A new WALK_FETCH or REC_FETCH replaces the one running; WALK_FETCH id 0 stops it. Card reads wait for a safe moment (no walk or trick). Any client."
fields = [
  { name = "boot", type = "u32", note = "0: this boot; else an earlier boot's number (its blocks and log on the card)" },
  { name = "from_ms", type = "u32", unit = "ms" },
  { name = "to_ms", type = "u32", unit = "ms" },
  { name = "what", type = "u8", enum = "rec_fetch_what" },
]

[[host_messages]]
name = "METRICS_REQ"
id = 0x54
dir = "client_to_mind"
kind = "command"
query = true
doc = "Answered by METRICS: line `index` of the mind's session metrics (counters since boot). A client asks for 0, 1, ... until index >= count. Any client."
fields = [
  { name = "index", type = "u8" },
]

[[host_messages]]
name = "REC_BENCH"
id = 0x55
dir = "client_to_mind"
kind = "command"
doc = "Measure the SD card's write times: `count` writes of each of several sizes to a scratch file, then its sync and close, then delete it, a write per pass. Controller only; refused (BUSY) unless the body is limp (REST, or no servo power) and no walk, trick, save, update or flash runs. RESULT OK, then BENCH_RESULT to this client per size, the last with write_bytes 0."
fields = [
  { name = "count", type = "u16", note = "writes per size, 1..256" },
]

[[host_messages]]
name = "REC_SAVE"
id = 0x56
dir = "client_to_mind"
kind = "command"
doc = "The card saver: mode 0 off, 1 on (remembered on the card: kilorec/SAVE_ON), 2 save now (at the next safe moment). Controller only. RESULT OK, or UNSUPPORTED (no card)."
fields = [
  { name = "mode", type = "u8", range = [0, 2] },
]

[[host_messages]]
name = "REC_DELETE"
id = 0x57
dir = "client_to_mind"
kind = "command"
doc = "Delete an earlier boot's recordings from the card (its blocks, run index and log); boot 0xFFFFFFFF: every earlier boot's. The running boot's are never deleted. Controller only; done at the next safe moment. RESULT OK (text: what goes)."
fields = [
  { name = "boot", type = "u32" },
]

[[host_messages]]
name = "GUARD"
id = 0x58
dir = "client_to_mind"
kind = "command"
query = true
doc = "The distance guard: mode 0 off, 1 on, 2 only ask. Answered by GUARD_STATUS. Any client (it moves nothing; kilo guard on|off --host)."
fields = [
  { name = "mode", type = "u8", range = [0, 2] },
]

[[host_messages]]
name = "CAL"
id = 0x59
dir = "client_to_mind"
kind = "command"
query = true
doc = "Joint calibration, relayed to the body with CAL_GET / CAL_SET / CAL_SAVE / CAL_REVERT (kilo cal ... --host). GET: any client. SET, SAVE, REVERT: the controller, or any client while the calibration posture (CALIB) is held; refused (BUSY) while a walk or trick runs. A SET takes effect at once on the held pose. Answered by CAL_STATUS once the body has answered; refused with RESULT: BAD_ARG (joint over 15, offset outside +-25 deg, as the body's CAL_SET range), NO_BODY, BUSY (another CAL in flight, the body's EEPROM busy), or the body's refusal as text."
fields = [
  { name = "op", type = "u8", enum = "cal_op" },
  { name = "joint", type = "u8", note = "SET: the legacy joint id 0..15 (CAL_VALUES' index); else 0" },
  { name = "offset_a16", type = "i16", unit = "deg", scale = 0.0625, note = "SET: the absolute offset, -400..400 (+-25 deg); else 0" },
]

[[host_messages]]
name = "RESULT"
id = 0x80
dir = "mind_to_client"
kind = "event"
doc = "The answer to a command without a reply message of its own, and to any refused command: its seq, its type, a code and a short reason."
fields = [
  { name = "request", type = "u8", note = "the request's type" },
  { name = "code", type = "u8", enum = "host_result_code" },
  { name = "text", type = "bytes", min = 0, max = 60, note = "ASCII, may be empty" },
]

[[host_messages]]
name = "STATUS"
id = 0x81
dir = "mind_to_client"
kind = "event"
reply_to = "STATUS_REQ"
doc = "The mind and what its link knows of the body. hello, telemetry and last_event are zero until state HAS_HELLO, HAS_TELEMETRY and event_count say otherwise."
fields = [
  { name = "host_version", type = "u8", note = "host.version" },
  { name = "mind_build", type = "u32", note = "the mind's build id (git hash, 8 hex digits; 0 = unknown)" },
  { name = "uptime_ms", type = "u32", unit = "ms" },
  { name = "state", type = "u8", flags = "host_state" },
  { name = "controller", type = "u8", enum = "host_controller" },
  { name = "clients", type = "u8", note = "connections open now, this one included" },
  { name = "proto_ok", type = "i8", note = "-1 no HELLO yet, 1 the body's proto major matches, 0 it does not (the mind refuses to drive)" },
  { name = "telemetry_age_ms", type = "u16", unit = "ms", note = "0xFFFF = none, or older than 65 s" },
  { name = "reboots", type = "u32", note = "body reboots seen" },
  { name = "telemetry_count", type = "u32" },
  { name = "event_count", type = "u32" },
  { name = "last_event", type = "EVENT" },
  { name = "hello", type = "HELLO" },
  { name = "link", type = "host_link_stats" },
  { name = "telemetry", type = "TELEMETRY" },
]

[[host_messages]]
name = "TELEM"
id = 0x82
dir = "mind_to_client"
kind = "stream"
doc = "The latest body telemetry and the link counters, at the rate TELEM_SUB asked; sent whether or not new TELEMETRY arrived."
fields = [
  { name = "uptime_ms", type = "u32", unit = "ms" },
  { name = "state", type = "u8", flags = "host_state" },
  { name = "telemetry_age_ms", type = "u16", unit = "ms", note = "0xFFFF = none, or older than 65 s" },
  { name = "telemetry_count", type = "u32" },
  { name = "event_count", type = "u32" },
  { name = "last_event", type = "EVENT" },
  { name = "link", type = "host_link_stats" },
  { name = "telemetry", type = "TELEMETRY" },
]

[[host_messages]]
name = "LOG_LINE"
id = 0x83
dir = "mind_to_client"
kind = "stream"
doc = "One line of the mind's log. seq counts the history lines the mind logged: a gap is lines this client lost (the ring overwrote them before they could be sent), and the first line's seq is how many older lines are gone. Status lines (the once-a-second counters, percepts, held keys: sent live only, never history) have bit 31 set and count on their own."
fields = [
  { name = "seq", type = "u32" },
  { name = "t_ms", type = "u32", unit = "ms", note = "mind uptime when logged" },
  { name = "level", type = "u8", enum = "log_level" },
  { name = "text", type = "bytes", min = 0, max = 159 },
]

[[host_messages]]
name = "BRIDGE_RX"
id = 0x84
dir = "mind_to_client"
kind = "stream"
doc = "Bytes the body's UART received, to the controller while the bridge is open."
fields = [
  { name = "data", type = "bytes", min = 1, max = 200 },
]

[[host_messages]]
name = "WALK_INFO"
id = 0x85
dir = "mind_to_client"
kind = "event"
reply_to = "WALK_LIST"
doc = "One recorded walk (found 1) and the store's state. text: ASCII `gait=NAME dir=NAME speed=MM_S end=REASON`, end last (the reason may hold spaces; empty while recording)."
fields = [
  { name = "found", type = "u8", note = "0: no walk after `after` (the fields below the store's are zero)" },
  { name = "kept", type = "u16", note = "walks in the store now" },
  { name = "recording", type = "u32", note = "the id being recorded now, 0 = none" },
  { name = "capacity", type = "u32", unit = "B", note = "the store's bytes for records" },
  { name = "used", type = "u32", unit = "B" },
  { name = "dropped_walks", type = "u32", note = "oldest walks dropped to make room, since the mind started" },
  { name = "dropped_records", type = "u32", note = "records lost by walks that outgrew the store (TRUNCATED)" },
  { name = "id", type = "u32", note = "1.. in the order recorded, since the mind started" },
  { name = "start_ms", type = "u32", unit = "ms", note = "mind uptime at the walk's setup" },
  { name = "duration_ms", type = "u32", unit = "ms", note = "setup to the end (so far, while recording)" },
  { name = "bytes", type = "u32", unit = "B", note = "the recording's size: what WALK_FETCH sends" },
  { name = "records", type = "u32" },
  { name = "feet", type = "u32", note = "FEET frames sent" },
  { name = "flags", type = "u8", flags = "walk_flags" },
  { name = "text", type = "bytes", min = 0, max = 120 },
]

[[host_messages]]
name = "WALK_DATA"
id = 0x86
dir = "mind_to_client"
kind = "stream"
doc = "Part of a walk's recording, to the client that sent WALK_FETCH: the records (walk_record_header, then the payload) as bytes, offset counting from the recording's first byte. The last one is END (or GONE: the store dropped the walk; fetch it again, it is not there any more)."
fields = [
  { name = "id", type = "u32" },
  { name = "offset", type = "u32", unit = "B" },
  { name = "total", type = "u32", unit = "B", note = "the recording's size" },
  { name = "status", type = "u8", enum = "walk_data_status" },
  { name = "data", type = "bytes", min = 0, max = 200 },
]

[[host_messages]]
name = "REC_STATUS"
id = 0x87
dir = "mind_to_client"
kind = "event"
reply_to = "REC_STATUS_REQ"
doc = "The flight recorder (RAM) and the card saver."
fields = [
  { name = "clock_ms", type = "u32", unit = "ms", note = "the mind's clock now, the one the blocks' t0 and REC_FETCH's from_ms/to_ms use (on the Pi: since power-on)" },
  { name = "boot", type = "u32", note = "this boot's number on the card, 0 = not known" },
  { name = "capacity", type = "u32", unit = "B", note = "the RAM ring" },
  { name = "used", type = "u32", unit = "B" },
  { name = "block_bytes", type = "u32", unit = "B" },
  { name = "blocks", type = "u32", note = "blocks in RAM now" },
  { name = "first_seq", type = "u32", note = "the oldest block in RAM" },
  { name = "next_seq", type = "u32", note = "the block being written" },
  { name = "oldest_ms", type = "u32", unit = "ms", note = "the mind's clock at the oldest block's start" },
  { name = "dropped_blocks", type = "u32", note = "blocks the ring overwrote" },
  { name = "records", type = "u32", note = "records written since boot" },
  { name = "skipped", type = "u32", note = "HEARTBEAT frames counted, not stored" },
  { name = "runs", type = "u32", note = "runs this boot" },
  { name = "card_state", type = "u8", enum = "record_card_state" },
  { name = "save_on", type = "u8" },
  { name = "saved_seq", type = "u32", note = "blocks below this are on the card" },
  { name = "unsaved_bytes", type = "u32", unit = "B", note = "what a power cut now would lose (RAM only)" },
  { name = "card_bytes", type = "u32", unit = "B", note = "recordings on the card" },
  { name = "card_files", type = "u16" },
  { name = "card_boots", type = "u16", note = "earlier boots with recordings on the card" },
  { name = "writes", type = "u32", note = "card writes since boot" },
  { name = "write_max_us", type = "u32", unit = "us", note = "the slowest (write, sync or close)" },
  { name = "slow_writes", type = "u32", note = "over host.record_slow_write_ms" },
  { name = "card_errors", type = "u32" },
]

[[host_messages]]
name = "METRICS"
id = 0x88
dir = "mind_to_client"
kind = "event"
reply_to = "METRICS_REQ"
doc = "One line of the session metrics: ASCII `group: key=value ...`."
fields = [
  { name = "index", type = "u8" },
  { name = "count", type = "u8", note = "lines there are" },
  { name = "text", type = "bytes", min = 0, max = 200 },
]

[[host_messages]]
name = "BENCH_RESULT"
id = 0x89
dir = "mind_to_client"
kind = "stream"
doc = "REC_BENCH's measurements for one write size, to the client that asked; the last has write_bytes 0 (and error, if it failed)."
fields = [
  { name = "write_bytes", type = "u32", unit = "B", note = "the size of each write; 0: the bench is over" },
  { name = "count", type = "u16" },
  { name = "error", type = "u8", note = "0 = ok; else the card refused (the bench stopped)" },
  { name = "min_us", type = "u32", unit = "us" },
  { name = "mean_us", type = "u32", unit = "us" },
  { name = "max_us", type = "u32", unit = "us" },
  { name = "sync_us", type = "u32", unit = "us", note = "f_sync after this size's writes" },
  { name = "close_us", type = "u32", unit = "us", note = "the scratch file's close (write_bytes 0 only)" },
  { name = "remove_us", type = "u32", unit = "us", note = "write_bytes 0 only: the scratch file's delete" },
]

[[host_messages]]
name = "GUARD_STATUS"
id = 0x8A
dir = "mind_to_client"
kind = "event"
reply_to = "GUARD"
doc = "The distance guard (docs/distance-guard.md): on or off, the zone, what it does, the eye colour, the filtered and the last raw range, the thresholds at the speed now, and its counters since boot."
fields = [
  { name = "enabled", type = "u8", note = "1 on (the kernel's default), 0 off" },
  { name = "zone", type = "u8", enum = "guard_zone" },
  { name = "action", type = "u8", enum = "guard_action" },
  { name = "eyes", type = "u8", enum = "guard_eyes", note = "the eye colour the mind asks for: the zone's, or orange for low battery while green" },
  { name = "eyes_driven", type = "u8", note = "1: SET_EYES goes to the body (HELLO caps EYES); 0: the firmware has no eyes" },
  { name = "dist_mm", type = "u16", unit = "mm", note = "filtered range; 0 = none (no echo, or the readings ignored)" },
  { name = "raw_mm", type = "u16", unit = "mm", note = "the last fresh reading as the body sent it (0 = no echo)" },
  { name = "blue_mm", type = "u16", unit = "mm", note = "BLUE below this, at the speed now" },
  { name = "red_mm", type = "u16", unit = "mm" },
  { name = "speed_mm_s", type = "u16", unit = "mm/s", note = "the forward walk's speed the thresholds use (0: not walking forward)" },
  { name = "zone_changes", type = "u32" },
  { name = "stops", type = "u32", note = "walks stopped at BLUE" },
  { name = "pullbacks", type = "u32", note = "walks backed off at RED" },
  { name = "refused", type = "u32", note = "forward keys refused while it held" },
]

[[host_messages]]
name = "SOUND"
id = 0x5A
dir = "client_to_mind"
kind = "command"
query = true
doc = "Kilo's sounds (docs/sound.md): ask, play a sound or a family by name, on, off, or set the volume. Answered by SOUND_STATUS (result says what a PLAY did); BAD_ARG for an unknown op or a volume over 100. Any client (kilo sound ... --host). Neither on/off nor the volume survives a reboot."
fields = [
  { name = "op", type = "u8", enum = "sound_op" },
  { name = "volume", type = "u8", note = "VOLUME: 0..100; else 0" },
  { name = "name", type = "bytes", min = 0, max = 15, note = "PLAY: the sound or family (ASCII, no null); else empty" },
]

[[host_messages]]
name = "SOUND_LIST"
id = 0x5B
dir = "client_to_mind"
kind = "command"
query = true
doc = "Answered by SOUND_INFO: entry `index` of the sounds built into the image. A client asks for 0, 1, ... until index >= count. Any client."
fields = [
  { name = "index", type = "u8" },
]

[[host_messages]]
name = "CAL_STATUS"
id = 0x8B
dir = "mind_to_client"
kind = "event"
reply_to = "CAL"
doc = "The body's 16 calibration offsets after the CAL (as CAL_VALUES), the op it answers, and for SAVE whether EEPROM_SAVED came within host.cal_save_wait_ms."
fields = [
  { name = "op", type = "u8", enum = "cal_op" },
  { name = "saved", type = "u8", note = "SAVE: 1 EEPROM_SAVED came, 0 not within the wait (queued only); else 0" },
  { name = "offset", type = "i16", count = 16, unit = "deg", scale = 0.0625, note = "by legacy joint id" },
]

[[host_messages]]
name = "SOUND_STATUS"
id = 0x8C
dir = "mind_to_client"
kind = "event"
reply_to = "SOUND"
doc = "Kilo's sounds after the SOUND: what it did, on or off, the volume, how many sounds the image has, the output's state, the counters since boot, and the sound playing now or played last."
fields = [
  { name = "result", type = "u8", enum = "sound_result" },
  { name = "enabled", type = "u8", note = "1 on (the kernel's default), 0 off" },
  { name = "volume", type = "u8", note = "0..100 (default 70)" },
  { name = "sounds", type = "u8", note = "sounds in the image" },
  { name = "state", type = "u8", enum = "sound_state" },
  { name = "played", type = "u32", note = "sounds started" },
  { name = "requests", type = "u32", note = "play requests (events, keys, the host)" },
  { name = "unknown", type = "u32", note = "requests for a name the image does not have" },
  { name = "dropped", type = "u32", note = "requests not played: replaced by a newer one, waited too long, off, asleep or no sounds" },
  { name = "late", type = "u32", note = "audio chunks refilled late (more than 1.5 chunk periods after the one before): a click is likely" },
  { name = "callback_max_us", type = "u32", unit = "us", note = "the longest the audio interrupt took to fill a chunk (0: no output)" },
  { name = "last", type = "bytes", min = 0, max = 15, note = "the sound playing now, or played last (empty: none yet)" },
]

[[host_messages]]
name = "SOUND_INFO"
id = 0x8D
dir = "mind_to_client"
kind = "event"
reply_to = "SOUND_LIST"
doc = "One sound built into the image: its name, sample rate and length. index >= count: past the end (name empty)."
fields = [
  { name = "index", type = "u8" },
  { name = "count", type = "u8", note = "sounds in the image" },
  { name = "rate", type = "u16", unit = "Hz", note = "the stored sample rate" },
  { name = "samples", type = "u32", note = "its length in samples (seconds = samples / rate)" },
  { name = "name", type = "bytes", min = 0, max = 15 },
]

[[host_messages]]
name = "FLASH_STATUS"
id = 0xC0
dir = "mind_to_client"
kind = "stream"
doc = "Progress of a flash, to the client that committed it: on every phase change and page, last DONE or FAILED."
fields = [
  { name = "phase", type = "u8", enum = "flash_phase" },
  { name = "error", type = "u8", enum = "flash_error" },
  { name = "attempt", type = "u8", note = "1.., a fresh reset each" },
  { name = "stk_cmd", type = "u8", note = "FAILED: the STK500 command that failed (0 none)" },
