# gen.py emits them as #defines and flash-table initializers (C, so they cost
# no RAM) and as plain data (Python); protocol/doc_check.py fails when the
# docs' tables disagree. Changing one here changes the body's binary: reflash.

# Gait (doc §3d). The steps themselves are the mind's (mind/kilo/planner): the
# body plays FEET. What the body still needs:
