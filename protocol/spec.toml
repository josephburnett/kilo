[[params]]
name = "BATT_WARN_CLEAR_MV"
id = 7
default = 6700
min = 5000
max = 8400
unit = "mV"
doc = "Battery WARN clear (held 10 s)."
brief = "WARN clear"

[[params]]
name = "BATT_LOW_MV"
id = 8
default = 6200
min = 5000
max = 8400
unit = "mV"
doc = "Battery LOW trip: epoch bump, REST, LIMP 2 s later."
brief = "LOW trip"

[[params]]
name = "BATT_LOW_CLEAR_MV"
id = 9
default = 6600
min = 5000
max = 8400
unit = "mV"
